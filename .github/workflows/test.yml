name: test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches:
      - 'master'
  pull_request:

env:
  BUILD_TAG: qbittorrent:test
  CONTAINER_NAME: qbittorrent

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      -
        name: Build
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: image-local
          set: |
            *.cache-from=type=gha,scope=build-linux-amd64
        env:
          DEFAULT_TAG: ${{ env.BUILD_TAG }}
      -
        name: Start
        run: |
          docker compose up -d
        working-directory: test
        env:
          QBITTORRENT_IMAGE: ${{ env.BUILD_TAG }}
          QBITTORRENT_CONTAINER: ${{ env.CONTAINER_NAME }}
      -
        name: Start container
        run: |
          docker rm -f ${CONTAINER_NAME} > /dev/null 2>&1 || true
          docker run -d --name ${CONTAINER_NAME} ${BUILD_TAG}
      -
        name: Check container logs
        uses: crazy-max/.github/.github/actions/container-logs-check@f91220cba053bd54299ba645a599ee8ed436f222 # v1.11.0
        with:
          name: ${{ env.CONTAINER_NAME }}
          log_check: "WebUI will be started shortly"
          timeout: 120
      -
        name: Check WebUI after recreating the container
        run: |
          docker exec "${CONTAINER_NAME}" curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:8080/api/v2/app/version
          docker exec "${CONTAINER_NAME}" curl --fail --data 'json={"web_ui_session_timeout":7200}' http://127.0.0.1:8080/api/v2/app/setPreferences
          docker stop "${CONTAINER_NAME}"
          docker run -d --name "${CONTAINER_NAME}-recreated" --volumes-from "${CONTAINER_NAME}" -e WEBUI_PORT=8081 "${BUILD_TAG}"
          docker exec "${CONTAINER_NAME}-recreated" curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:8081/api/v2/app/version
          docker exec "${CONTAINER_NAME}-recreated" grep -qx 'SessionTimeout=7200' /data/config/qBittorrent.conf
      -
        name: Logs
        if: always()
        run: |
          docker logs "${CONTAINER_NAME}-recreated" || true
          docker compose logs
        working-directory: test
        env:
          QBITTORRENT_IMAGE: ${{ env.BUILD_TAG }}
          QBITTORRENT_CONTAINER: ${{ env.CONTAINER_NAME }}
